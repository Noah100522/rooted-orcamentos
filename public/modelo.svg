<g fill="#333" font-family="Arial" font-size="11"><text x="165" y="842" font-weight="700">MATERIAIS E GARANTIA</text><text x="165" y="860">Materiais fornecidos pela Rooted Informática possuem garantia conforme as</text><text x="165" y="875">condições do fabricante e a legislação aplicável.</text><text x="165" y="890">A mão de obra possui garantia legal de 90 dias sobre a execução do serviço,</text><text x="165" y="905">observadas as condições legais aplicáveis.</text><text x="165" y="920">Materiais fornecidos pelo cliente permanecem sujeitos às condições de garantia</text><text x="165" y="935">do respectivo fabricante ou fornecedor, sem prejuízo das responsabilidades legais.</text><text x="165" y="968" fill="#e23b3b" font-size="14" font-weight="700">GARANTIA</text><text x="165" y="986" font-weight="700">Todos os equipamentos possuem garantia do fabricante e nosso</text><text x="165" y="1001">serviço inclui assistência técnica especializada.</text><text x="165" y="1027" font-weight="700">Chave PIX</text><text x="165" y="1043">TELEFONE: (41) 99801-2451</text><text x="165" y="1059">Roberto Jean Martins</text><text x="165" y="1077" font-weight="700">ROOTED INFORMÁTICA</text></g>
